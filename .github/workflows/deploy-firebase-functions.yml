name: Deploy Firebase Cloud Functions and Firestore rules

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Validate function source
        working-directory: functions
        run: npm run lint
      - name: Authenticate to Google Cloud
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy notification function and Firestore rules
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npx --yes firebase-tools deploy --only firestore:ai-studio-hamahangi-ac566711-0b2e-48f6-b737-0db9ea92d2f8,functions --project peak-amp-lxjsq --non-interactive
      - name: Skip deployment until credentials are configured
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::warning::Add FIREBASE_SERVICE_ACCOUNT to repository Actions secrets, then run this workflow again to deploy FCM and Firestore rules."
