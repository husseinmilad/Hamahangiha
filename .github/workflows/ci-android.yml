name: Validate and build Android APK

on:
  push:
    branches: [main, feat/supabase-email-password-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://cyufuqdfalkpotjlxkhu.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build web app
        run: npm run build
      - name: Check Android build credentials
        run: |
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Set the SUPABASE_PUBLISHABLE_KEY GitHub Actions secret to build a functional Android APK. Android packaging will be skipped."
          fi
      - name: Generate Android project
        if: env.VITE_SUPABASE_PUBLISHABLE_KEY != ''
        run: npx cap add android
      - name: Sync Capacitor
        if: env.VITE_SUPABASE_PUBLISHABLE_KEY != ''
        run: npx cap sync android
      - name: Add Android local notification permissions
        if: env.VITE_SUPABASE_PUBLISHABLE_KEY != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace("<application", permission + "\\n    <application", 1)
          path.write_text(content)
          PY
      - name: Configure Android system bars and safe content area
        if: env.VITE_SUPABASE_PUBLISHABLE_KEY != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          java_files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if not java_files:
              raise SystemExit("MainActivity.java was not generated")
          main = java_files[0]
          source = main.read_text()
          if "WindowCompat.setDecorFitsSystemWindows" not in source:
              source = source.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import android.os.Bundle;\n"
                  "import android.graphics.Color;\n"
                  "import android.view.View;\n"
                  "import androidx.core.view.WindowCompat;"
              )
              source = source.replace(
                  "public class MainActivity extends BridgeActivity {",
                  "public class MainActivity extends BridgeActivity {\n"
                  "    @Override\n"
                  "    public void onCreate(Bundle savedInstanceState) {\n"
                  "        super.onCreate(savedInstanceState);\n"
                  "        WindowCompat.setDecorFitsSystemWindows(getWindow(), true);\n"
                  "        getWindow().setStatusBarColor(Color.rgb(248, 250, 252));\n"
                  "        getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);\n"
                  "    }"
              )
              main.write_text(source)

          # Android 15+ otherwise forces edge-to-edge for target SDK 35.
          for styles in Path("android/app/src/main/res").glob("values*/styles.xml"):
              content = styles.read_text()
              if "windowOptOutEdgeToEdgeEnforcement" in content:
                  continue
              match = re.search(r'(<style[^>]*name="AppTheme(?:\.NoActionBar)?"[^>]*>)(.*?)(</style>)', content, re.S)
              if match:
                  content = content[:match.start(2)] + match.group(2) + (
                      '\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>'
                  ) + content[match.end(2):]
                  styles.write_text(content)
          PY
      - name: Build debug APK
        if: env.VITE_SUPABASE_PUBLISHABLE_KEY != ''
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        if: env.VITE_SUPABASE_PUBLISHABLE_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: hamahangi-supabase-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
